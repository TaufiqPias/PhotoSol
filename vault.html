<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Vault</title><link rel="stylesheet" href="style.css"><style>#cv{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column}
#cv video{flex:1;min-height:0;width:100%;object-fit:contain}
#cvbar{display:flex;align-items:center;justify-content:space-around;padding:16px;color:#fff}
#cvbar button{width:auto;margin:0;padding:12px 22px}#cvbar #shut{width:76px;height:76px;padding:0;border-radius:50%;background:#fff;border:6px solid #888}
#cvbar #shut:active{background:#bbb}</style></head><body><div class="wrap">
<div class="card" id="info">Loading…</div>
<div class="card" id="act" hidden>
<div class="row"><button id="cam">Take Photos</button><button id="up" class="sec">Upload Photos</button></div>
<input id="fu" type="file" accept="image/*" multiple hidden>
<div class="msg" id="count">No photos yet.</div><div class="thumbs" id="th"></div>
<div class="bar" id="bar" hidden><i></i></div>
<button id="sub" disabled>Submit Photos</button>
<button id="fin" class="ok" hidden>Submit Order</button><div class="msg" id="msg"></div></div></div>
<div id="cv" hidden><video id="vid" autoplay playsinline muted></video>
<div id="cvbar"><span id="cvn">0 taken</span><button id="shut" aria-label="Take photo"></button><button id="cvdone">Done</button></div></div>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id');let files=[],done=0;
const post=b=>fetch(API_URL,{method:'POST',body:JSON.stringify({id,...b})}).then(r=>r.json());
(async()=>{try{
  const r=await(await fetch(API_URL+'?id='+encodeURIComponent(id))).json();if(!r.ok)throw 0;const o=r.order;
  const kv=(k,v)=>v?`<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`:'';
  $('info').innerHTML=`<h1>Work Order ${esc(o.wo)}</h1>`+kv('Address',o.address)+kv('Due Date',o.due)+kv('LockBox',o.lock)+kv('Key Code',o.code)+kv('Payment',o.pay)+
   (o.instr?`<details style="margin-top:10px"><summary>Work order instructions</summary><pre>${esc(o.instr)}</pre></details>`:'');
  $('act').hidden=false;
}catch(e){$('info').textContent='This vault link is invalid.';}})();
$('up').onclick=()=>$('fu').click();
const sc=(w,h)=>Math.min(1,640/Math.max(w,h),480/Math.min(w,h));
function addFile(f){files.push(f);const i=new Image();i.onload=()=>URL.revokeObjectURL(i.src);i.src=URL.createObjectURL(f);
  const t=$('th');t.appendChild(i);while(t.children.length>24)t.removeChild(t.firstChild);
  $('count').textContent=files.length+' photo(s) ready';$('sub').disabled=!files.length;$('fin').hidden=true;}
function add(e){for(const f of e.target.files)addFile(f);e.target.value='';}
$('fu').onchange=add;
let stream;
$('cam').onclick=async()=>{try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});
  $('vid').srcObject=stream;$('cv').hidden=false;$('cvn').textContent=files.length+' taken';
}catch(e){$('msg').textContent='Camera unavailable: '+e.message;}};
$('shut').onclick=()=>{const v=$('vid');if(!v.videoWidth)return;const s=sc(v.videoWidth,v.videoHeight),c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  c.toBlob(b=>{if(b){addFile(b);$('cvn').textContent=files.length+' taken';}},'image/jpeg',.8);
  v.style.opacity=.3;setTimeout(()=>v.style.opacity=1,80);};
$('cvdone').onclick=()=>{stream&&stream.getTracks().forEach(t=>t.stop());$('cv').hidden=true;};
async function shrink(f){const b=await createImageBitmap(f),s=sc(b.width,b.height);
  const c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  const d=c.toDataURL('image/jpeg',.85);return d.split(',')[1];}
$('sub').onclick=async()=>{$('sub').disabled=$('cam').disabled=$('up').disabled=true;$('bar').hidden=false;$('msg').textContent='';
  const total=files.length+done;
  while(files.length){const f=files[0];
    try{const r=await post({action:'upload',name:Date.now()+'_'+(done+1)+'.jpg',type:'image/jpeg',data:await shrink(f)});if(!r.ok)throw new Error(r.error);
      files.shift();done++;$('bar').firstChild.style.width=(done/total*100)+'%';$('count').textContent=`Uploaded ${done} of ${total}`;
    }catch(e){$('msg').textContent='Upload interrupted ('+e.message+'). Tap Submit Photos to retry.';$('sub').disabled=$('cam').disabled=$('up').disabled=false;return;}}
  $('th').innerHTML='';$('msg').textContent='All photos uploaded ✔';$('fin').hidden=false;$('cam').disabled=$('up').disabled=false;};
$('fin').onclick=async()=>{$('fin').disabled=true;try{const r=await post({action:'submit'});if(!r.ok)throw new Error(r.error);
  $('act').innerHTML='<h1>✔ Order submitted</h1><p>Thank you! The office has been notified.</p>';}
  catch(e){$('msg').textContent='Error: '+e.message;$('fin').disabled=false;}};
</script></body></html>
