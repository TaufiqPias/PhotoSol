<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Photo Vault</title><link rel="stylesheet" href="style.css"><style>
[hidden]{display:none!important}
#cv[hidden]{display:none}
#cv{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;background:#000;z-index:9;overflow:hidden}
#cv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cvn,#cvdone{position:absolute;top:14px;color:#fff;background:rgba(0,0,0,.5);border-radius:18px}
#cvn{left:14px;padding:7px 14px;font-size:.9rem}
#cvdone{right:14px;width:auto;margin:0;padding:8px 20px;border:1px solid rgba(255,255,255,.4)}
#shut{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:78px;height:78px;margin:0;padding:0;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.55);background-clip:padding-box;touch-action:manipulation}
#shut:active{background:#ccc}
#flash{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:40px;height:40px;margin:0;padding:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
#flash.on{background:#ffd23f;color:#000}#flash svg{width:20px;height:20px}
@media(orientation:landscape){#shut{left:auto;right:28px;bottom:auto;top:50%;transform:translateY(-50%)}}
.top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.logo{font:800 1.7rem/1 system-ui,sans-serif;letter-spacing:-1.5px}.logo span{color:var(--pri);font-weight:300;letter-spacing:-1px}
.co{color:var(--mut);font-weight:600;font-size:.95rem;border-left:2px solid var(--bd);padding-left:12px}
.ii+.ii{border-top:1px solid var(--bd);margin-top:10px;padding-top:10px}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.pr img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.pm{flex:1;min-width:0}.pn{font-size:.9rem;margin-bottom:4px}.pm .bar{margin-top:0}
.pb{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--pri);transition:width .15s}.pb i.g{background:var(--ok)}
.ps{min-width:34px;text-align:right;font-size:.8rem;color:var(--mut)}.er{color:#d03a3a}
.tick{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px}
button.ib{width:30px;height:30px;margin:0;padding:0;flex:none;background:transparent;color:var(--mut);border:1px solid var(--bd);border-radius:50%;font-size:13px}
#pl{margin-top:10px}#more{margin-top:6px;padding:9px;font-size:.9rem}
</style></head><body><div class="wrap">
<header class="top"><div class="logo">Photo<span>Sol</span></div><div class="co">Kingson Transport LLC</div></header>
<div class="card" id="info">Loading…</div>
<div class="card" id="act" hidden>
<div class="row" id="cr"><button id="cam">Take Photos</button><button id="up" class="sec">Upload Photos</button></div>
<input id="fu" type="file" accept="image/*" multiple hidden>
<div class="msg" id="gps"></div>
<div class="msg" id="count">No photos yet.</div>
<div id="pl"></div><button id="more" class="sec" hidden></button>
<button id="sub" disabled>Submit Photos</button>
<button id="fin" class="ok" hidden>Submit Order</button><div id="thanks" hidden><h1>✔ Order submitted</h1><p>Thank you! The office has been notified.</p></div>
<button id="rcpt" class="sec" hidden>Download Receipt</button><div class="msg" id="msg"></div></div></div>
<div id="cv" hidden><video id="vid" autoplay playsinline muted></video>
<span id="cvn">0 taken</span><button id="flash" aria-label="Flash" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></button><button id="shut" aria-label="Take photo"></button><button id="cvdone">Done</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id');
let items=[],seq=0,vis=5,busy=false,ORD=null,INS=[],when='';
const post=b=>fetch(API_URL,{method:'POST',body:JSON.stringify({id,...b})}).then(r=>r.json());
(async()=>{try{
  const r=await(await fetch(API_URL+'?id='+encodeURIComponent(id))).json();if(!r.ok)throw 0;const o=r.order;
  const kv=(k,v)=>v?`<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`:'';
  let ins=Array.isArray(o.instrs)&&o.instrs.length?o.instrs:(o.instr?[o.instr]:[]);
  if(ins.length===1&&/\n\n(?=\d+\. )/.test(ins[0]))ins=ins[0].split(/\n\n(?=\d+\. )/).map(t=>t.replace(/^\d+\.\s/,''));
  $('info').innerHTML=`<h1>Work Order ${esc(o.wo)}</h1>`+kv('Address',o.address)+kv('Work Order Type',o.type)+kv('Due Date',o.due)+kv('Contractor',o.contractor)+
   (o.phone?`<div class="kv"><span>Support Phone</span><a href="tel:${esc(o.phone.replace(/[^0-9+]/g,''))}">${esc(o.phone)}</a></div>`:'')+kv('LockBox',o.lock)+kv('Key Code',o.code)+kv('Payment',o.pay)+
   (ins.length?`<details style="margin-top:10px"><summary>Work order instructions</summary>${ins.map((t,i)=>`<div class="ii"><pre>${ins.length>1?(i+1)+'. ':''}${esc(t)}</pre></div>`).join('')}</details>`:'');
  ORD=o;INS=ins;$('act').hidden=false;gStart();cvTxt();
}catch(e){$('info').textContent='This vault link is invalid.';}})();

const sc=(w,h)=>Math.min(800/Math.max(w,h),600/Math.min(w,h));
const toB=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const mkMeta=(t,p,src)=>({t,src,lat:p?p.coords.latitude:null,lon:p?p.coords.longitude:null,acc:p?Math.round(p.coords.accuracy):null});
function descOf(m){if(!m)return'';const d=m.t,z=-d.getTimezoneOffset();
  let s=`Taken: ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} (UTC${z<0?'-':'+'}${pad(Math.floor(Math.abs(z)/60))}:${pad(Math.abs(z)%60)})`;
  s+=m.lat!=null?` | GPS: ${m.lat.toFixed(6)}, ${m.lon.toFixed(6)} (+/-${m.acc} m) | https://www.google.com/maps?q=${m.lat.toFixed(6)},${m.lon.toFixed(6)}`:' | GPS: not available';
  return s+' | Source: '+(m.src==='camera'?'camera':'gallery upload (time = file date, GPS = device location at upload)');}
/*EXIF*/
function exif(m){
  const A=s=>[...s].map(c=>c.charCodeAt(0)&127).concat(0),U16=v=>[v>>8&255,v&255],U32=v=>[v>>>24&255,v>>16&255,v>>8&255,v&255];
  const R=(a,b)=>U32(a).concat(U32(b)),E=(tag,type,count,bytes)=>({tag,type,count,bytes});
  const d=m.t,ds=`${d.getFullYear()}:${pad(d.getMonth()+1)}:${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const z=-d.getTimezoneOffset(),tzs=(z<0?'-':'+')+pad(Math.floor(Math.abs(z)/60))+':'+pad(Math.abs(z)%60);
  const dms=v=>{v=Math.abs(v);const g=Math.floor(v),mi=Math.floor((v-g)*60),sc=((v-g)*60-mi)*60;return[...R(g,1),...R(mi,1),...R(Math.round(sc*10000),10000)];};
  const sz=es=>2+12*es.length+4+es.reduce((n,e)=>n+(e.bytes.length>4?e.bytes.length+(e.bytes.length&1):0),0);
  const out=(es,off)=>{es=[...es].sort((a,b)=>a.tag-b.tag);const h=[...U16(es.length)],dat=[];let dp=off+2+12*es.length+4;
    for(const e of es){h.push(...U16(e.tag),...U16(e.type),...U32(e.count));
      if(e.bytes.length>4){h.push(...U32(dp));dat.push(...e.bytes);if(e.bytes.length&1)dat.push(0);dp+=e.bytes.length+(e.bytes.length&1);}
      else h.push(...e.bytes,...Array(4-e.bytes.length).fill(0));}
    return h.concat(U32(0),dat);};
  const desc=A(m.src==='camera'?'Source: camera':'Source: gallery upload');
  const ex=[E(0x9003,2,20,A(ds)),E(0x9004,2,20,A(ds)),E(0x9011,2,7,A(tzs))];
  const gp=m.lat!=null?[E(0,1,4,[2,3,0,0]),E(1,2,2,A(m.lat<0?'S':'N')),E(2,5,3,dms(m.lat)),E(3,2,2,A(m.lon<0?'W':'E')),E(4,5,3,dms(m.lon)),
    E(7,5,3,[...R(d.getUTCHours(),1),...R(d.getUTCMinutes(),1),...R(d.getUTCSeconds(),1)]),
    E(0x1D,2,11,A(`${d.getUTCFullYear()}:${pad(d.getUTCMonth()+1)}:${pad(d.getUTCDate())}`))]:null;
  const mk=(eo,go)=>{const e=[E(0x010E,2,desc.length,desc),E(0x8769,4,1,U32(eo))];if(gp)e.push(E(0x8825,4,1,U32(go)));return e;};
  const eo=8+sz(mk(0,0)),go=eo+sz(ex);
  const body=[69,120,105,102,0,0,77,77,0,42,0,0,0,8,...out(mk(eo,go),8),...out(ex,eo),...(gp?out(gp,go):[])],len=body.length+2;
  return Uint8Array.from([255,225,len>>8&255,len&255,...body]);}
/*EXIFEND*/
async function dens(b,m){try{let a=new Uint8Array(await b.arrayBuffer());
  if(a[0]===255&&a[1]===216&&a[2]===255&&a[3]===224&&a[6]===74&&a[7]===70){a[13]=1;a[14]=1;a[15]=44;a[16]=1;a[17]=44;}
  if(m){const x=exif(m),o=new Uint8Array(a.length+x.length);o.set(a.subarray(0,2));o.set(x,2);o.set(a.subarray(2),2+x.length);a=o;}
  return new Blob([a],{type:'image/jpeg'});}catch(_){return b;}}
async function enc(c,m){const LO=200000,HI=350000;let lo=.5,hi=.98,q=.9,best=null;
  for(let i=0;i<6;i++){const b=await toB(c,q);if(!b)break;
    const d=b.size<LO?LO-b.size:b.size>HI?b.size-HI:0;if(!best||d<best.d)best={b,d};
    if(!d)break;if(b.size>HI)hi=q;else lo=q;q=(lo+hi)/2;}
  if(!best)throw new Error('Encode failed');return dens(best.b,m);}
async function prep(f,m){const b=await createImageBitmap(f),s=sc(b.width,b.height),c=document.createElement('canvas');
  c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(b,0,0,c.width,c.height);
  return enc(c,m);}
function rowH(x){const bar=x.s==='pend'?'':`<div class="pb"><i class="${x.s==='done'?'g':''}" style="width:${x.p}%"></i></div>`;
  const st=x.s==='done'?'<span class="tick">✔</span>':x.s==='up'?x.p+'%':x.s==='err'?'<span class="er">Failed</span>':'';
  const rm=(x.s==='pend'||x.s==='err')?`<button class="ib" onclick="rmv(${x.id})" aria-label="Remove photo">✕</button>`:'';
  return `<div class="pr" id="r${x.id}"><img loading="lazy" src="${x.u}" alt=""><div class="pm"><div class="pn">${esc(x.n||'Photo '+x.id)}</div>${bar}</div><div class="ps">${st}</div>${rm}</div>`;}
function upd(x,full){const r=$('r'+x.id);if(!r)return;const i=r.querySelector('.pb i');
  if(!full&&x.s==='up'&&i){i.style.width=x.p+'%';r.querySelector('.ps').textContent=x.p+'%';}else r.outerHTML=rowH(x);}
function stats(){const d=items.filter(x=>x.s==='done').length,p=items.filter(x=>x.s==='pend'||x.s==='err').length;
  $('count').textContent=items.length?`${items.length} photo(s) · ${d} uploaded · ${p} waiting`:'No photos yet.';
  $('sub').disabled=busy||!p;$('fin').hidden=busy||p>0||!d;$('rcpt').hidden=!d;}
function render(){$('pl').innerHTML=items.slice(0,vis).map(rowH).join('');
  const rem=items.length-vis;$('more').hidden=items.length<=5;$('more').textContent=rem>0?`Show more photos (${rem} more)`:'Show less';stats();}
$('more').onclick=()=>{vis=items.length-vis>0?vis+10:5;render();};
function addBlob(b,m){items.push({id:++seq,meta:m,b,u:URL.createObjectURL(b),s:'pend',p:0});render();}
function rmv(n){const k=items.findIndex(x=>x.id===n);if(k<0)return;URL.revokeObjectURL(items[k].u);items.splice(k,1);render();}
$('up').onclick=()=>$('fu').click();
$('fu').onchange=async e=>{const fs=[...e.target.files];e.target.value='';$('msg').textContent='';const p=await getPos();if(!p){gMsg();$('msg').textContent='Photos not added. '+$('msg').textContent;return;}
  for(const f of fs){try{const m=mkMeta(new Date(f.lastModified||Date.now()),p,'gallery');addBlob(await prep(f,m),m);}catch(_){}}};

let stream,track,torch=false,taken=0;
function chkTorch(){const c=track&&track.getCapabilities?track.getCapabilities():{};$('flash').hidden=!c.torch;}
let pos=null,gw=null,denied=false;
function cvTxt(){$('gps').textContent=pos?'Location ✔ ready':denied?'Location is blocked':'Location: waiting for GPS…';
  $('cvn').textContent=taken+' taken · '+(pos?'GPS ✔':'GPS off');$('shut').disabled=!pos;}
function gStart(){if(!navigator.geolocation||gw!=null)return;
  gw=navigator.geolocation.watchPosition(p=>{pos=p;denied=false;cvTxt();},e=>{if(e.code===1){pos=null;denied=true;}cvTxt();},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});}
function gStop(){if(gw!=null&&navigator.geolocation)navigator.geolocation.clearWatch(gw);gw=null;}
const getPos=()=>pos?Promise.resolve(pos):new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{pos=p;denied=false;r(p);},e=>{if(e.code===1)denied=true;r(null);},{enableHighAccuracy:true,timeout:15000,maximumAge:60000}):r(null));
function gMsg(){$('msg').textContent=denied?'Location is blocked. Allow location for this page (tap the lock icon in the address bar → Permissions → Location → Allow), then try again.':'Location is required. Turn on Location / GPS on your phone, allow it for this page, then try again.';}
function closeCam(){try{document.fullscreenElement&&document.exitFullscreen();}catch(_){}
  stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('cv').hidden=true;}
$('cam').onclick=async()=>{
  if(!pos){$('msg').textContent='Getting your location…';gStop();gStart();await getPos();if(!pos){gMsg();cvTxt();return;}$('msg').textContent='';}
  const cv=$('cv');cv.hidden=false;taken=0;cvTxt();
  try{const r=(cv.requestFullscreen||cv.webkitRequestFullscreen||(()=>0)).call(cv);r&&r.catch&&r.catch(()=>{});}catch(_){}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1600},height:{ideal:1200}},audio:false});
    track=stream.getVideoTracks()[0];torch=false;$('flash').classList.remove('on');chkTorch();$('vid').onplaying=chkTorch;$('vid').srcObject=stream;
  }catch(e){closeCam();$('msg').textContent='Camera unavailable: '+e.message;}};
$('flash').onclick=async()=>{try{torch=!torch;await track.applyConstraints({advanced:[{torch}]});$('flash').classList.toggle('on',torch);}
  catch(e){torch=false;$('flash').classList.remove('on');$('flash').hidden=true;}};
$('shut').onclick=()=>{if(!pos)return;navigator.vibrate&&navigator.vibrate(25);const v=$('vid');if(!v.videoWidth)return;const s=sc(v.videoWidth,v.videoHeight),c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(v,0,0,c.width,c.height);
  const m=mkMeta(new Date(),pos,'camera');taken++;cvTxt();enc(c,m).then(b=>addBlob(b,m)).catch(()=>{});
  v.style.opacity=.3;setTimeout(()=>v.style.opacity=1,80);};
$('cvdone').onclick=closeCam;

const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b);});
$('sub').onclick=async()=>{busy=true;$('msg').textContent='';stats();let ok=true;
  for(const x of items.filter(x=>x.s==='pend'||x.s==='err')){
    x.s='up';x.p=0;upd(x,true);
    const t=setInterval(()=>{x.p=Math.min(90,x.p+Math.max(1,Math.round((90-x.p)*.12)));upd(x);},150);
    try{const r=await post({action:'upload',name:Date.now()+'_'+x.id+'.jpg',type:'image/jpeg',data:await b64(x.b),desc:descOf(x.meta)});
      if(!r.ok)throw new Error(r.error);x.n=r.name;x.s='done';x.p=100;
    }catch(e){x.s='err';ok=false;$('msg').textContent='Upload interrupted ('+e.message+'). Tap Submit Photos to retry.';}
    clearInterval(t);upd(x,true);stats();if(!ok)break;}
  busy=false;stats();if(ok)$('msg').textContent='All photos uploaded ✔';};

/*RCPT*/
function buildReceipt(J,o,ins,th,when){
  const doc=new J({unit:'mm',format:'a4'}),W=210,M=15,H=297;let y=22;
  const chk=n=>{if(y+n>H-M){doc.addPage();y=M+4;}};
  doc.setFont('helvetica','bold');doc.setFontSize(24);doc.setTextColor(26,34,48);doc.text('Photo',M,y);
  const pw=doc.getTextWidth('Photo');doc.setFont('helvetica','normal');doc.setTextColor(29,111,224);doc.text('Sol',M+pw,y);
  doc.setFontSize(12);doc.setTextColor(90,100,115);doc.text('Kingson Transport LLC',W-M,y,{align:'right'});
  y+=5;doc.setDrawColor(200);doc.line(M,y,W-M,y);y+=10;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(26,34,48);doc.text('Work Order Receipt',M,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(110);doc.text('Submitted: '+when,W-M,y,{align:'right'});y+=9;
  const rows=[['Work Order #',o.wo],['Type',o.type],['Property Address',o.address],['Due Date',o.due],['Contractor',o.contractor],['Support Phone',o.phone],['LockBox',o.lock],['Key Code',o.code],['Payment',o.pay]].filter(r=>r[1]);
  doc.setFontSize(10.5);
  for(const [k,v] of rows){const ls=doc.splitTextToSize(String(v),W-M-62);chk(ls.length*5+3);
    doc.setTextColor(110);doc.text(k,M,y);doc.setTextColor(26,34,48);doc.text(ls,62,y);y+=ls.length*5+2;doc.setDrawColor(230);doc.line(M,y-3.5,W-M,y-3.5);}
  if(ins.length){y+=6;chk(14);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(26,34,48);doc.text('Work Order Instructions',M,y);y+=7;
    doc.setFont('helvetica','normal');doc.setFontSize(10);
    ins.forEach((t,i)=>{for(const l of doc.splitTextToSize((ins.length>1?(i+1)+'. ':'')+t,W-2*M)){chk(5);doc.text(l,M,y);y+=4.8;}
      if(i<ins.length-1){y+=1.5;chk(4);doc.setDrawColor(210);doc.line(M,y,W-M,y);y+=5;}});}
  y+=8;chk(30);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(26,34,48);doc.text('Uploaded Photos ('+th.length+')',M,y);y+=6;
  const cols=4,gap=4,cw=(W-2*M-gap*(cols-1))/cols,ch=cw*.75,lh=10;let ry=y;
  th.forEach((t,i)=>{const c=i%cols;if(c===0){chk(ch+lh+gap);ry=y;}
    const k=Math.min(cw/t.w,ch/t.h),w=t.w*k,h=t.h*k,x=M+c*(cw+gap);
    doc.addImage(t.d,'JPEG',x,ry,w,h);
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(26,34,48);doc.text(String(t.name),x,ry+ch+3.6);
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(110);doc.text(String(t.when||''),x,ry+ch+7);
    if(c===cols-1||i===th.length-1)y=ry+ch+lh+gap;});
  const n=doc.getNumberOfPages();doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(140);
  for(let p=1;p<=n;p++){doc.setPage(p);doc.text('Page '+p+' of '+n,W/2,H-8,{align:'center'});}
  return doc;}
/*END*/
async function thumb(b){const bm=await createImageBitmap(b),s=Math.min(1,240/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return{d:c.toDataURL('image/jpeg',.7),w:c.width,h:c.height};}
$('rcpt').onclick=async()=>{const b=$('rcpt');b.disabled=true;b.textContent='Preparing receipt…';
  try{const th=[];for(const x of items.filter(x=>x.s==='done'))th.push({...await thumb(x.b),name:x.n||'Photo '+x.id,when:x.meta?fmt(x.meta.t):''});
    buildReceipt(window.jspdf.jsPDF,ORD,INS,th,when||new Date().toLocaleString()).save('Receipt_WO-'+String(ORD.wo).replace(/[^\w-]+/g,'_')+'.pdf');
  }catch(e){$('msg').textContent='Could not create receipt: '+e.message;}
