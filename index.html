<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoSol – Admin</title><link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:1200px}
.top{display:flex;align-items:center;gap:14px;margin:4px 0 18px;flex-wrap:wrap}
.logo{font:800 2rem/1 system-ui,sans-serif;letter-spacing:-1.5px}.logo span{color:var(--pri);font-weight:300;letter-spacing:-1px}
.co{color:var(--mut);font-size:1.05rem;font-weight:600;border-left:2px solid var(--bd);padding-left:14px}
@media(min-width:900px){body{padding:24px}}
.fg{display:grid;grid-template-columns:1fr;gap:0 14px}.full{grid-column:1/-1}
@media(min-width:600px){.fg{grid-template-columns:repeat(2,1fr)}.s2{grid-column:span 2}}
@media(min-width:1000px){.fg{grid-template-columns:repeat(4,1fr)}}
#ins,#ins textarea,#list,.vr{width:100%}.fg>div{min-width:0}
.act{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-direction:column;margin-top:6px}.act button,.act .msg{margin:0}
@media(min-width:700px){.act{flex-direction:row}.act button{width:auto;padding:13px 34px}}

.ins{position:relative;margin-bottom:8px}.ins .x{position:absolute;right:6px;top:6px}
button.add{background:transparent;color:var(--pri);border:1px dashed var(--pri);padding:9px;font-size:.9rem}
button.ib{width:34px;height:34px;padding:0;margin:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--pri);border:1px solid var(--bd);border-radius:8px;flex:none}
button.ib:hover{background:var(--bg)}button.ib.dng{color:#d03a3a}button.ib svg{width:18px;height:18px}
.x{width:26px;height:26px}
input[type=checkbox]{width:18px;height:18px;padding:0;flex:none}
.tb{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.85rem;color:var(--mut)}.tb label{display:flex;align-items:center;gap:6px;margin:0;color:inherit}
.tb button{width:auto;margin:0 0 0 auto;padding:7px 12px;font-size:.85rem;background:#d03a3a}
.vr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.vn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.empty{color:var(--mut);font-size:.9rem;padding:10px 0}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin:20px 0 6px}
</style></head><body><div class="wrap">
<header class="top"><div class="logo">Photo<span>Sol</span></div><div class="co">Kingson Transport LLC</div></header>
<div class="card"><h1>Create Photo Vault</h1>
<div class="fg">
<div><label>Admin key</label><input id="key" type="password" placeholder="Your ADMIN_KEY"></div>
<div><label>Work Order Number *</label><input id="wo"></div>
<div><label>Work Order Type</label><input id="type" placeholder="e.g. Lawn cut"></div>
<div><label>Due Date</label><input id="due" type="date"></div>
<div class="s2"><label>Property Address *</label><input id="address"></div>
<div><label>Contractor Name</label><input id="contractor"></div>
<div><label>Support Phone</label><input id="phone" type="tel"></div>
<div><label>LockBox Number (optional)</label><input id="lock"></div>
<div><label>Key Code (optional)</label><input id="code"></div>
<div class="s2"><label>Payment</label><input id="pay" placeholder="e.g. $85"></div>
<div class="full"><label>Work Order Instructions</label><div id="ins"></div><button type="button" class="add" id="addins">+ Add Another Instruction</button></div>
</div>
<div class="act"><div class="msg" id="msg"></div><button id="go">Create Photo Vault</button></div></div>
<div class="card" id="side"><h1>Vaults (<span id="cnt">0</span>)</h1>
<div class="tb"><label><input type="checkbox" id="all"> Select all</label><button id="bulk" disabled>Remove selected (0)</button></div>
<div id="list"></div></div>
<footer>Developed by Taufiq Pias</footer></div>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"';
const I={d:`<svg ${S}><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
c:`<svg ${S}><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`,
t:`<svg ${S}><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>`,
x:`<svg ${S}><path d="M6 6l12 12M18 6L6 18"/></svg>`};
$('key').value=localStorage.pvKey||'';
let vaults=JSON.parse(localStorage.pvList||'[]'),sel=new Set();
function addIns(){const d=document.createElement('div');d.className='ins';
  d.innerHTML='<textarea rows="3" placeholder="Instruction"></textarea>'+($('ins').children.length?`<button type="button" class="ib x" title="Remove instruction">${I.x}</button>`:'');
  if(d.querySelector('.x'))d.querySelector('.x').onclick=()=>d.remove();$('ins').appendChild(d);}
addIns();$('addins').onclick=()=>{addIns();$('ins').lastChild.firstChild.focus();};
function save(){localStorage.pvList=JSON.stringify(vaults);}
function render(){
  $('list').innerHTML=vaults.length?vaults.map((v,i)=>`<div class="vr"><input type="checkbox" data-i="${i}" ${sel.has(v.link)?'checked':''}>
<div class="vn" title="${esc(v.name)}">${esc(v.name)}</div>
<button class="ib" title="Open Drive folder" onclick="window.open(vaults[${i}].drive)">${I.d}</button>
<button class="ib" title="Copy link" onclick="copyL(${i})">${I.c}</button>
<button class="ib dng" title="Remove from list" onclick="rm([${i}])">${I.t}</button></div>`).join(''):'<div class="empty">No vaults yet.</div>';
  $('cnt').textContent=vaults.length;$('bulk').disabled=!sel.size;$('bulk').textContent='Remove selected ('+sel.size+')';
  $('all').checked=vaults.length>0&&sel.size===vaults.length;}
$('list').onchange=e=>{const v=vaults[e.target.dataset.i];if(!v)return;e.target.checked?sel.add(v.link):sel.delete(v.link);render();};
$('all').onchange=e=>{sel=e.target.checked?new Set(vaults.map(v=>v.link)):new Set();render();};
$('bulk').onclick=()=>rm([...vaults.keys()].filter(i=>sel.has(vaults[i].link)));
function rm(ix){if(!ix.length||!confirm('Remove '+ix.length+' folder(s) from this list?\nThe Google Drive folders are NOT deleted.'))return;
  const gone=new Set(ix.map(i=>vaults[i].link));vaults=vaults.filter(v=>!gone.has(v.link));gone.forEach(l=>sel.delete(l));save();render();}
function copyL(i){navigator.clipboard.writeText(vaults[i].link);$('msg').textContent='Link copied.';}
$('go').onclick=async()=>{
  const parts=[...document.querySelectorAll('#ins textarea')].map(t=>t.value.trim()).filter(Boolean);
  const instr=parts.length>1?parts.map((t,i)=>(i+1)+'. '+t).join('\n\n'):(parts[0]||'');
  const o={wo:$('wo').value.trim(),type:$('type').value.trim(),contractor:$('contractor').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),due:$('due').value,lock:$('lock').value.trim(),code:$('code').value.trim(),instr,instrs:parts,pay:$('pay').value.trim()};
  if(!o.wo||!o.address){$('msg').textContent='Work order number and address are required.';return;}
  localStorage.pvKey=$('key').value;$('go').disabled=true;$('msg').textContent='Creating…';
  try{const r=await(await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'create',key:$('key').value,order:o})})).json();
    if(!r.ok)throw new Error(r.error);
    vaults.unshift({name:r.name,link:new URL('vault.html?id='+r.id,location.href).href,drive:r.url});
    save();render();$('msg').textContent='Vault created ✔';
  }catch(e){$('msg').textContent='Error: '+e.message;}
  $('go').disabled=false;};
render();
</script></body></html>
